<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rejestracja | LabSystem</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/Rejestracja.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<div class="register-page">
    <div class="register-card">
        <div class="register-header">
            <i class="fas fa-user-plus"></i>
            <h2>Nowe Konto</h2>
            <p>Dołącz do systemu LabSystem</p>
        </div>

        <form th:action="@{/register}" method="post">
            <div class="input-row">
                <div class="input-group">
                    <label for="imie">Imię</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text"
                               id="imie"
                               name="imie"
                               placeholder="Jan"
                               minlength="2"
                               maxlength="50"
                               required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="nazwisko">Nazwisko</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text"
                               id="nazwisko"
                               name="nazwisko"
                               placeholder="Kowalski"
                               minlength="2"
                               maxlength="50"
                               required>
                    </div>
                </div>
            </div>

            <div class="input-row">
                <div class="input-group">
                    <label for="pesel">PESEL</label>
                    <div class="input-wrapper">
                        <i class="fas fa-id-card"></i>
                        <input type="text"
                               id="pesel"
                               name="pesel"
                               placeholder="00000000000"
                               inputmode="numeric"
                               pattern="[0-9]{11}"
                               minlength="11"
                               maxlength="11"
                               title="PESEL musi zawierać dokładnie 11 cyfr"
                               required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="plec">Płeć</label>
                    <div class="input-wrapper select-wrapper">
                        <i class="fas fa-venus-mars"></i>
                        <select id="plec" name="plec" required>
                            <option value="" disabled selected>Wybierz...</option>
                            <option value="M">Mężczyzna</option>
                            <option value="F">Kobieta</option>
                            <option value="X">Inna / nie podano</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="input-row">
                <div class="input-group">
                    <label for="telefon">Telefon</label>
                    <div class="input-wrapper">
                        <i class="fas fa-phone"></i>
                        <input type="tel"
                               id="telefon"
                               name="telefon"
                               placeholder="500600700"
                               inputmode="numeric"
                               pattern="[0-9]{9}"
                               minlength="9"
                               maxlength="9"
                               title="Numer telefonu musi zawierać dokładnie 9 cyfr"
                               required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="dataUrodzenia">Data urodzenia</label>
                    <div class="input-wrapper">
                        <i class="fas fa-calendar"></i>
                        <input type="date"
                               id="dataUrodzenia"
                               name="dataUrodzenia"
                               required>
                    </div>
                </div>
            </div>

            <div class="input-row">
                <div class="input-group">
                    <label for="adres">Adres</label>
                    <div class="input-wrapper">
                        <i class="fas fa-map-marker-alt"></i>
                        <input type="text"
                               id="adres"
                               name="adres"
                               placeholder="Warszawa, ul. Prosta 1"
                               minlength="5"
                               maxlength="255"
                               required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="email">Adres e-mail</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email"
                               id="email"
                               name="email"
                               placeholder="twoj@email.pl"
                               maxlength="255"
                               required>
                    </div>
                </div>
            </div>

            <div class="input-row">
                <div class="input-group">
                    <label for="haslo">Hasło</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password"
                               id="haslo"
                               name="haslo"
                               placeholder="••••••••"
                               minlength="8"
                               maxlength="100"
                               title="Hasło musi mieć minimum 8 znaków"
                               required>
                    </div>
                </div>
            </div>

            <button type="submit" class="register-submit">Utwórz konto</button>
        </form>

        <div class="login-prompt">
            Masz już konto? <a th:href="@{/login}">Zaloguj się</a>
        </div>

        <div class="back-home">
            <a th:href="@{/}"><i class="fas fa-arrow-left"></i> Powrót do portalu</a>
        </div>
    </div>
</div>

</body>
</html>
