<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Zarządzanie użytkownikami | LabSystem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link th:href="@{/css/dashboard.css}" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="#">
      <i class="fa-solid fa-flask"></i> System Diagnostyczny
    </a>
    <a href="/dashboard" class="btn btn-outline-light btn-sm">
      <i class="fa-solid fa-arrow-left"></i> Wróć do dashboardu
    </a>
  </div>
</nav>

<div class="container mt-5">

  <div th:if="${param.sukces}" class="alert alert-success alert-dismissible fade show">
    <i class="fa-solid fa-circle-check"></i> Rola została zmieniona.
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <div class="card shadow-lg p-5">
    <h2 class="text-primary fw-bold mb-4">
      <i class="fa-solid fa-users"></i> Zarządzanie użytkownikami
    </h2>

    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>E-mail</th>
          <th>Aktualna rola</th>
          <th>Akcje</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${uzytkownicy}">

          <td th:text="${u.id}"></td>

          <td th:text="${u.email}"></td>

          <td>
            <span class="badge bg-primary" th:text="${u.rola.nazwa}"></span>
          </td>

          <td>
            <div class="d-flex gap-2 align-items-center flex-wrap">

              <button class="btn btn-outline-primary btn-sm btn-edytuj"
                      th:data-id="${u.id}">
                <i class="fa-solid fa-pen"></i> Edytuj
              </button>

              <form th:action="@{|/admin/users/${u.id}/rola|}"
                    method="post"
                    th:id="|form-${u.id}|"
                    class="d-none gap-2 align-items-center">

                <select class="form-select form-select-sm"
                        name="idRola"
                        style="min-width: 140px;">
                  <option th:each="r : ${role}"
                          th:value="${r.id}"
                          th:text="${r.nazwa}"
                          th:selected="${r.id == u.rola.id}">
                  </option>
                </select>

                <button type="submit" class="btn btn-success btn-sm">
                  <i class="fa-solid fa-check"></i> Zatwierdź
                </button>

                <button type="button" class="btn btn-secondary btn-sm btn-anuluj"
                        th:data-id="${u.id}">
                  Anuluj
                </button>

              </form>

            </div>
          </td>

        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Używamy event delegation zamiast onclick w atrybucie
  // — unikamy problemu z Thymeleaf generującym onclick jako string
  document.addEventListener('click', function (e) {

    // Klik Edytuj
    const btnEdytuj = e.target.closest('.btn-edytuj');
    if (btnEdytuj) {
      const id = btnEdytuj.dataset.id;
      btnEdytuj.classList.add('d-none');
      const form = document.getElementById('form-' + id);
      form.classList.remove('d-none');
      form.classList.add('d-flex');
    }

    // Klik Anuluj
    const btnAnuluj = e.target.closest('.btn-anuluj');
    if (btnAnuluj) {
      const id = btnAnuluj.dataset.id;
      const form = document.getElementById('form-' + id);
      form.classList.add('d-none');
      form.classList.remove('d-flex');
      // Znajdź przycisk Edytuj w tym samym wierszu i pokaż go
      form.closest('td').querySelector('.btn-edytuj').classList.remove('d-none');
    }

  });
</script>

</body>
</html>
